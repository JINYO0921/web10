<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            margin: 10px;
            font-size: 36px;
        }
        .a{
            text-emphasis-style: filled;
            text-emphasis-color: red;
            font-size: 32px;
        }
        .b{
            text-emphasis-style: filled;
            text-emphasis-color: red;
            font-size: 32px;
        }
        .c{
            text-emphasis: open orange;
            font-size: 32px;
        }
        .d{
            text-emphasis: triangle #9097;
            font-size: 32px;
        }
        .e{
            text-emphasis: "哈" orange;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <h3>今天天氣真是不錯!!</h3>
    <p class="a">今天天氣真是不錯!!</p>
    <p class="b">今天天氣真是不錯!!</p>
    <p class="c">今天天氣真是不錯!!</p>
    <p class="d">今天天氣真是不錯!!</p>
    <p class="e">今天天氣真是不錯!!</p>
</body>
</html>
